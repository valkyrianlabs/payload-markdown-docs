name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline --unsafe-perm

      - name: Build
        run: |
          export NEXT_CPU_COUNT=$(nproc)
          pnpm build

      - name: Run tests
        run: |
          set -euo pipefail
          pnpm test:int

  native-cli:
    name: Native CLI
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          bash .github/scripts/install-apt-deps.sh \
            build-essential \
            cmake \
            doctest-dev \
            libcli11-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            meson \
            ninja-build \
            nlohmann-json3-dev \
            pkgconf

      - name: Build and test native CLI
        run: |
          set -euo pipefail
          meson setup build-native -Dinstall_skill_data=false
          meson compile -C build-native
          meson test -C build-native

      - name: Smoke test Meson install
        run: |
          set -euo pipefail
          meson install -C build-native --destdir "$PWD/stage-native"
          PMDOCS_DATA_DIR="$PWD/stage-native/usr/local/share/pmdocs" \
            "$PWD/stage-native/usr/local/bin/pmdocs" doctor
