name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or SHA to release-check.
        required: false
        type: string
      publish:
        description: Run protected publication steps.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE || 'disabled' }}
  RELEASE_PUBLISH_REQUIRED: ${{ vars.RELEASE_PUBLISH_REQUIRED || 'auto' }}
  RELEASE_DEBIAN_DISTRIBUTION: ${{ vars.RELEASE_DEBIAN_DISTRIBUTION || '' }}
  RELEASE_DEBIAN_URGENCY: ${{ vars.RELEASE_DEBIAN_URGENCY || '' }}
  HOMEBREW_TAP_PUBLISH_MODE: ${{ vars.HOMEBREW_TAP_PUBLISH_MODE || 'disabled' }}
  HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || '' }}
  HOMEBREW_TAP_BRANCH: ${{ vars.HOMEBREW_TAP_BRANCH || 'main' }}
  NPM_PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME || '' }}
  DOCS_SYNC_ENDPOINT: ${{ vars.DOCS_SYNC_ENDPOINT || 'https://valkyrianlabs.com/api/documentation/sync' }}

jobs:
  validate-release-state:
    name: Validate release state
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    outputs:
      version: ${{ steps.state.outputs.version }}
      release_tag: ${{ steps.state.outputs.release_tag }}
      publish_required: ${{ steps.state.outputs.publish_required }}
      package_name: ${{ steps.state.outputs.package_name }}
      package_private: ${{ steps.state.outputs.package_private }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling Python dependencies
        run: |
          set -euo pipefail
          bash .github/scripts/setup-release-python.sh

      - name: Validate versions and publication policy
        id: state
        shell: bash
        env:
          DISPATCH_REF: ${{ github.event.inputs.ref || '' }}
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish || 'dry-run' }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail

          python -m tools.release check

          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be a plain semantic version, got '${version}'."
            exit 1
          fi

          release_tag=""
          if [ -n "$EVENT_RELEASE_TAG" ]; then
            release_tag="$EVENT_RELEASE_TAG"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "$DISPATCH_REF" == refs/tags/* ]]; then
            release_tag="${DISPATCH_REF#refs/tags/}"
          elif [[ "$DISPATCH_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_tag="$DISPATCH_REF"
          fi

          raw_required="${RELEASE_PUBLISH_REQUIRED:-auto}"
          case "$raw_required" in
            auto)
              if [ "${GITHUB_EVENT_NAME}" = "release" ] || [ "$DISPATCH_PUBLISH" = "publish" ]; then
                publish_required="true"
              else
                publish_required="false"
              fi
              ;;
            true|false)
              publish_required="$raw_required"
              ;;
            *)
              echo "::error::Invalid RELEASE_PUBLISH_REQUIRED value: ${raw_required}. Expected auto|true|false."
              exit 1
              ;;
          esac

          if [ "$DISPATCH_PUBLISH" = "publish" ]; then
            publish_required="true"
          fi

          if [ -n "$release_tag" ]; then
            if [ "$release_tag" != "v${version}" ] && [ "$release_tag" != "$version" ]; then
              echo "::error::Release tag '${release_tag}' does not match VERSION '${version}'."
              echo "::error::Expected 'v${version}' or '${version}'."
              exit 1
            fi
          fi

          if [ "$publish_required" = "true" ]; then
            if [ -z "$release_tag" ]; then
              echo "::error::Publication requires a release tag."
              exit 1
            fi
            if [ "$release_tag" != "v${version}" ]; then
              echo "::error::Multi-package publication requires the canonical tag 'v${version}'."
              exit 1
            fi
          fi

          package_name="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("package.json").read_text(encoding="utf-8"))["name"])
          PY
          )"
          expected_package_name="${NPM_PACKAGE_NAME:-$package_name}"
          if [ "$package_name" != "$expected_package_name" ]; then
            echo "::error::package.json name '${package_name}' does not match NPM_PACKAGE_NAME '${expected_package_name}'."
            exit 1
          fi
          package_private="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(str(bool(json.loads(Path("package.json").read_text(encoding="utf-8")).get("private", False))).lower())
          PY
          )"

          {
            echo "version=${version}"
            echo "release_tag=${release_tag}"
            echo "publish_required=${publish_required}"
            echo "package_name=${package_name}"
            echo "package_private=${package_private}"
          } >> "$GITHUB_OUTPUT"

          echo "VERSION=${version}"
          echo "release_tag=${release_tag:-<none>}"
          echo "publish_required=${publish_required}"
          echo "package_name=${package_name}"
          echo "expected_package_name=${expected_package_name}"
          echo "package_private=${package_private}"

  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    needs:
      - validate-release-state
      - native-debian
      - homebrew-formula
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline

      - name: Ensure package is publishable
        if: needs.validate-release-state.outputs.package_private == 'true'
        run: |
          echo "::error::package.json has private=true; refusing to publish."
          exit 1

      - name: Build package
        run: |
          set -euo pipefail
          export NEXT_CPU_COUNT="$(nproc)"
          pnpm build

      - name: Run plugin tests
        run: |
          set -euo pipefail
          pnpm test:int

      - name: Verify npm version is unpublished
        if: needs.validate-release-state.outputs.publish_required == 'true'
        shell: bash
        env:
          PKG_NAME: ${{ needs.validate-release-state.outputs.package_name }}
          PKG_VERSION: ${{ needs.validate-release-state.outputs.version }}
        run: |
          set -euo pipefail
          published="$(npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "::error::npm already has ${PKG_NAME}@${PKG_VERSION}; refusing to publish."
            exit 1
          fi

      - name: Validate package contents
        env:
          EXPECTED_PACKAGE_NAME: ${{ needs.validate-release-state.outputs.package_name }}
        run: |
          set -euo pipefail
          npm pack --dry-run
          mkdir -p release/npm
          npm pack --pack-destination release/npm
          tarball_count="$(find release/npm -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')"
          if [ "$tarball_count" -ne 1 ]; then
            echo "::error::Expected exactly one npm tarball, found ${tarball_count}."
            find release/npm -maxdepth 1 -type f | sort
            exit 1
          fi
          tarball="$(find release/npm -maxdepth 1 -type f -name '*.tgz' | sort | head -n 1)"
          actual_name="$(tar -xOf "$tarball" package/package.json | node -e 'let d = ""; process.stdin.on("data", c => d += c); process.stdin.on("end", () => console.log(JSON.parse(d).name));')"
          if [ "$actual_name" != "$EXPECTED_PACKAGE_NAME" ]; then
            echo "::error::npm tarball package name '${actual_name}' does not match expected '${EXPECTED_PACKAGE_NAME}'."
            exit 1
          fi

      - name: npm publish dry-run
        run: |
          set -euo pipefail
          npm publish --dry-run --access public

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmdocs-npm-${{ needs.validate-release-state.outputs.version }}
          path: release/npm/*.tgz
          if-no-files-found: error

  native-debian:
    name: Native CLI and Debian package
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    needs: validate-release-state
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling Python dependencies
        run: |
          set -euo pipefail
          bash .github/scripts/setup-release-python.sh

      - name: Install native and release-tooling dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-apt-deps.sh \
            build-essential \
            cmake \
            debhelper \
            devscripts \
            doctest-dev \
            dpkg-dev \
            libcli11-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            meson \
            ninja-build \
            nlohmann-json3-dev \
            pkgconf

      - name: Build and test native CLI
        run: |
          set -euo pipefail
          meson setup build-native
          meson compile -C build-native
          meson test -C build-native
          ./build-native/cli/pmdocs --version

      - name: Upload native pmdocs Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmdocs-linux-amd64
          path: build-native/cli/pmdocs
          if-no-files-found: error

      - name: Generate release changelog
        shell: bash
        env:
          RELEASE_AI_MODE: ${{ vars.RELEASE_AI_MODE || 'auto' }}
          RELEASE_AI_PROFILE_OPENAI: ${{ vars.RELEASE_AI_PROFILE_OPENAI || 'openai-balanced' }}
          RELEASE_LOCAL_LLM_ENABLED: ${{ vars.RELEASE_LOCAL_LLM_ENABLED || 'false' }}
          RELEASE_LOCAL_LLM_PROFILE: ${{ vars.RELEASE_LOCAL_LLM_PROFILE || '' }}
          RELEASE_LOCAL_LLM_BASE_URL: ${{ vars.RELEASE_LOCAL_LLM_BASE_URL || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          RELEASE_LOCAL_LLM_API_KEY: ${{ secrets.RELEASE_LOCAL_LLM_API_KEY || '' }}
        run: |
          set -euo pipefail
          mkdir -p release
          python -m tools.release changelog release \
            --output release/changelog.release.md \
            --raw-output release/changelog.raw.md \
            --payload-output release/changelog.payload.json \
            --semantic-payload-output release/changelog.semantic_payload.json \
            --context-output release/changelog.context.json \
            --release-notes-output release/release_notes.md \
            --selection-output release/changelog.selection.json

      - name: Build Debian package
        run: |
          set -euo pipefail
          python -m tools.release build-deb --output-dir release

      - name: Validate Debian package artifact
        run: |
          set -euo pipefail
          python -m tools.release validate-release-artifacts --output-dir release

      - name: Smoke install Debian package in container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/release:/release:ro" \
            -v "$PWD/dev/docs-fixtures:/fixtures:ro" \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y ca-certificates
              apt-get install -y /release/*.deb
              pmdocs --version
              pmdocs doctor
              pmdocs validate /fixtures/basic --source payload-markdown-docs
              pmdocs skill install --dry-run
            '

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmdocs-debian-${{ needs.validate-release-state.outputs.version }}
          path: |
            release/*.deb
            release/*.changes
            release/*.buildinfo
            release/build-deb.log
            release/changelog.release.md
            release/changelog.raw.md
            release/changelog.payload.json
            release/changelog.semantic_payload.json
            release/changelog.context.json
            release/changelog.selection.json
            release/release_notes.md
            release/release_notes.md.context.json
          if-no-files-found: error

  homebrew-formula:
    name: Homebrew formula
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    needs: validate-release-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling Python dependencies
        run: |
          set -euo pipefail
          bash .github/scripts/setup-release-python.sh

      - name: Install native and formula validation dependencies
        run: |
          set -euo pipefail
          bash .github/scripts/install-apt-deps.sh \
            build-essential \
            cmake \
            curl \
            doctest-dev \
            libcli11-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            meson \
            ninja-build \
            nlohmann-json3-dev \
            pkgconf \
            ruby

      - name: Validate release state and formula syntax
        run: |
          set -euo pipefail
          python -m tools.release check
          ruby -c homebrew/Formula/pmdocs.rb
          python -m tools.release prepare-homebrew-formula --output-dir release --dry-run

      - name: Build and test native CLI for formula source build parity
        run: |
          set -euo pipefail
          meson setup build-homebrew
          meson compile -C build-homebrew
          meson test -C build-homebrew

      - name: Stage release Homebrew formula
        if: needs.validate-release-state.outputs.publish_required == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.validate-release-state.outputs.version }}
        run: |
          set -euo pipefail
          archive_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          sha256="$(curl -fsSL "$archive_url" | shasum -a 256 | awk '{print $1}')"
          python -m tools.release prepare-homebrew-formula \
            --output-dir release \
            --archive-url "$archive_url" \
            --sha256 "$sha256"
          ruby -c release/homebrew/Formula/pmdocs.rb

      - name: Upload Homebrew formula artifact
        if: needs.validate-release-state.outputs.publish_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pmdocs-homebrew-${{ needs.validate-release-state.outputs.version }}
          path: release/homebrew/Formula/pmdocs.rb
          if-no-files-found: error

  assemble-release-artifacts:
    name: Assemble release artifacts
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    needs:
      - validate-release-state
      - npm-package
      - native-debian
      - homebrew-formula
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling Python dependencies
        run: |
          set -euo pipefail
          bash .github/scripts/setup-release-python.sh

      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: pmdocs-npm-${{ needs.validate-release-state.outputs.version }}
          path: release/npm

      - name: Download Debian package artifacts
        uses: actions/download-artifact@v4
        with:
          name: pmdocs-debian-${{ needs.validate-release-state.outputs.version }}
          path: release

      - name: Download Homebrew formula artifact
        if: needs.validate-release-state.outputs.publish_required == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pmdocs-homebrew-${{ needs.validate-release-state.outputs.version }}
          path: release/homebrew/Formula

      - name: Validate assembled release artifacts
        shell: bash
        run: |
          set -euo pipefail
          args=(--output-dir release)
          if [ "${{ needs.validate-release-state.outputs.publish_required }}" = "true" ]; then
            args+=(--require-homebrew)
          fi
          python -m tools.release validate-release-artifacts "${args[@]}"

      - name: Prepare GitHub release asset list (deduped)
        if: needs.validate-release-state.outputs.release_tag != ''
        id: gh_release_assets
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="release"
          mapfile -t release_assets < <(find "$artifact_dir" -type f | LC_ALL=C sort -u)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "::error::No files found for GitHub release asset attachment under ${artifact_dir}."
            exit 1
          fi

          echo "[gh-release] deduped asset count: ${#release_assets[@]}"
          printf '%s\n' "${release_assets[@]}"

          {
            echo "assets<<EOF"
            printf '%s\n' "${release_assets[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Release assets
        if: needs.validate-release-state.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-release-state.outputs.release_tag }}
          files: ${{ steps.gh_release_assets.outputs.assets }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmdocs-release-${{ needs.validate-release-state.outputs.version }}
          path: release
          if-no-files-found: error

  publish-debian:
    name: Publish Debian artifacts to Nexus
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    needs:
      - validate-release-state
      - assemble-release-artifacts
    environment: Production
    env:
      NEXUS_REPO_URL: ${{ vars.NEXUS_REPO_URL || '' }}
      NEXUS_USER: ${{ secrets.NEXUS_USER || '' }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling Python dependencies
        run: |
          set -euo pipefail
          bash .github/scripts/setup-release-python.sh

      - name: Download combined release artifact
        uses: actions/download-artifact@v4
        with:
          name: pmdocs-release-${{ needs.validate-release-state.outputs.version }}
          path: release

      - name: Publish or dry-run Debian upload
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.validate-release-state.outputs.publish_required }}" = "true" ]; then
            python -m tools.release publish-deb --output-dir release --require-enabled
          else
            python -m tools.release publish-deb --output-dir release --mode disabled --dry-run
          fi

      - name: Smoke install published APT package
        if: needs.validate-release-state.outputs.publish_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.valkyrianlabs.com/pubkey.gpg -o valkyrianlabs.gpg
          sudo -n install -m 0644 valkyrianlabs.gpg /etc/apt/keyrings/valkyrianlabs.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/valkyrianlabs.gpg] https://apt.valkyrianlabs.com stable main" \
            | sudo -n tee /etc/apt/sources.list.d/valkyrianlabs.list > /dev/null
          sudo -n apt update
          sudo -n apt purge -y pmdocs || true
          sudo -n apt install -y pmdocs
          pmdocs --version

  publish-homebrew-tap:
    name: Publish Homebrew tap formula
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    needs:
      - validate-release-state
      - assemble-release-artifacts
    if: needs.validate-release-state.outputs.publish_required == 'true'
    environment: Production
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || '' }}
    steps:
      - name: Download combined release artifact
        uses: actions/download-artifact@v4
        with:
          name: pmdocs-release-${{ needs.validate-release-state.outputs.version }}
          path: release

      - name: Validate Homebrew tap publication settings
        shell: bash
        run: |
          set -euo pipefail
          if [ "${HOMEBREW_TAP_PUBLISH_MODE}" != "tap" ]; then
            echo "::error::Homebrew tap publication is required, but HOMEBREW_TAP_PUBLISH_MODE is '${HOMEBREW_TAP_PUBLISH_MODE}'."
            exit 1
          fi
          if [ -z "${HOMEBREW_TAP_REPOSITORY}" ]; then
            echo "::error::HOMEBREW_TAP_REPOSITORY is required for tap publication."
            exit 1
          fi
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required for tap publication."
            exit 1
          fi
          test -f release/homebrew/Formula/pmdocs.rb

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPOSITORY }}
          ref: ${{ env.HOMEBREW_TAP_BRANCH }}
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Commit formula update
        shell: bash
        env:
          VERSION: ${{ needs.validate-release-state.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp release/homebrew/Formula/pmdocs.rb homebrew-tap/Formula/pmdocs.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/pmdocs.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew formula already up to date."
            exit 0
          fi
          git -C homebrew-tap commit -m "Update pmdocs ${VERSION}"
          git -C homebrew-tap push origin "HEAD:${HOMEBREW_TAP_BRANCH}"

  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs:
      - validate-release-state
      - npm-package
      - publish-debian
      - publish-homebrew-tap
    if: >
      needs.validate-release-state.outputs.publish_required == 'true' &&
      needs.npm-package.result == 'success' &&
      needs.publish-debian.result == 'success' &&
      needs.publish-homebrew-tap.result == 'success'
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: pmdocs-npm-${{ needs.validate-release-state.outputs.version }}
          path: release/npm

      - name: Publish to npm through trusted publishing
        shell: bash
        env:
          EXPECTED_PACKAGE_NAME: ${{ needs.validate-release-state.outputs.package_name }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find release/npm -maxdepth 1 -type f -name '*.tgz' | sort)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one npm tarball, found ${#tarballs[@]}."
            printf '%s\n' "${tarballs[@]}"
            exit 1
          fi
          actual_name="$(tar -xOf "${tarballs[0]}" package/package.json | node -e 'let d = ""; process.stdin.on("data", c => d += c); process.stdin.on("end", () => console.log(JSON.parse(d).name));')"
          if [ "$actual_name" != "$EXPECTED_PACKAGE_NAME" ]; then
            echo "::error::npm tarball package name '${actual_name}' does not match expected '${EXPECTED_PACKAGE_NAME}'."
            exit 1
          fi
          npm publish "${tarballs[0]}" --access public

  publish-docs:
    name: Publish docs
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    needs:
      - validate-release-state
      - native-debian
      - publish-debian
      - publish-homebrew-tap
      - publish-npm
    if: >
      needs.validate-release-state.outputs.publish_required == 'true' &&
      needs.native-debian.result == 'success' &&
      needs.publish-debian.result == 'success' &&
      needs.publish-homebrew-tap.result == 'success' &&
      needs.publish-npm.result == 'success'
    environment:
      name: Production
      url: ${{ env.DOCS_SYNC_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download workflow-built pmdocs
        uses: actions/download-artifact@v4
        with:
          name: pmdocs-linux-amd64
          path: .artifacts/pmdocs-linux-amd64

      - name: Prepare workflow-built pmdocs
        run: |
          set -euo pipefail
          mkdir -p .tools
          cp .artifacts/pmdocs-linux-amd64/pmdocs .tools/pmdocs
          chmod +x .tools/pmdocs
          echo "$PWD/.tools" >> "$GITHUB_PATH"
          export PATH="$PWD/.tools:$PATH"
          PMDOCS_BIN="$(command -v pmdocs)"
          echo "Using workflow-built pmdocs artifact: ${PMDOCS_BIN}"
          pmdocs --version
          pmdocs --help

      - name: Validate and push docs
        run: |
          set -euo pipefail
          export PATH="$PWD/.tools:$PATH"
          PMDOCS_BIN="$(command -v pmdocs)"
          echo "Publishing docs with workflow-built pmdocs: ${PMDOCS_BIN}"

          pmdocs --version

          pmdocs validate ./docs \
            --source payload-markdown-docs

          pmdocs push ./docs \
            --endpoint "${DOCS_SYNC_ENDPOINT}" \
            --source payload-markdown-docs \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --github-oidc \
            --publish
