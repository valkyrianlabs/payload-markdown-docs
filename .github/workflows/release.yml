# Release payload-markdown-docs (the Payload plugin on npm and the native pmdocs CLI) with
# vl-release.
#
#   vlr cut patch|minor|major --push      (locally) -> pushes vX.Y.Z -> this workflow
#
# build ─▶ publish-debian ─▶ publish-npm ─▶ github-release ─▶ publish-homebrew ─▶ finalize
#                                       └─▶ publish-docs ─────────────────────────┘
#
# `vlr prepare` promotes .release/RELEASE_NOTES_NEXT.md and .release/CHANGELOG_NEXT.md into
# RELEASE_NOTES.md and debian/changelog in each job's work tree only (deterministic, so every job
# renders the same documents). The build job builds and validates every artifact once (npm
# tarballs, .deb, source archive, Homebrew formula); later jobs publish and attach those exact
# bytes. Nothing is written back to main unless every publication succeeded. Publication never
# replaces published bytes: re-running a failed job skips whatever is already identical.
#
# npm: one build, two names. `vlr build-npm` packs @valkyrianlabs/payload-markdown-docs and
# derives payload-markdown-docs from the same tarball (release.toml [[npm.aliases]]);
# `vlr publish-npm` plans both before uploading either and uploads the alias first. Both
# npmjs.com packages trust this workflow file (`release.yml`) and the `Production` environment
# (trusted publishing, OIDC; no token secret). A brand-new alias cannot use trusted publishing
# until it exists: see `vlr help ci` ("A new alias on npmjs.com") for the one-time bootstrap.
#
# Runners: every job runs on the self-hosted runner inside the disposable CI container
# (`./ci/run-ci`, rootless Podman; see ci/README.md) except publish-npm, because npm trusted
# publishing only accepts GitHub-hosted runners. Clean-install smoke tests use a digest-pinned
# stock Ubuntu image through the same wrapper.
#
# Variables: RELEASE_PUBLISH_MODE (`nexus` publishes the APT package; npm publishes unless it is
# `disabled`), NEXUS_APT_REPO (or NEXUS_REPO_URL), DOCS_SYNC_ENDPOINT. Secrets: NEXUS_USER,
# NEXUS_PASSWORD (or NEXUS_PASS), HOMEBREW_TAP_TOKEN (contents:write on valkyrianlabs/homebrew-tap).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag (e.g. v1.2.0), or a branch/SHA to rehearse
        required: true
        type: string
      publish:
        description: Publish (requires a v* tag), or rehearse everything without publishing
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.event.inputs.ref || github.ref }}
  DOCS_SYNC_ENDPOINT: ${{ vars.DOCS_SYNC_ENDPOINT || 'https://valkyrianlabs.com/api/documentation/sync' }}
  PMDOCS_SOURCE: payload-markdown-docs

jobs:
  build:
    name: Prepare, build and validate
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    permissions:
      contents: read
      id-token: write # pmdocs push --github-oidc --dry-run
    outputs:
      version: ${{ steps.state.outputs.version }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Publication mode
        id: mode
        env:
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish || 'dry-run' }}
        run: |
          publish=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "$DISPATCH_PUBLISH" = "publish" ]; then
            publish=true
            case "$RELEASE_REF" in
              refs/tags/v*|v[0-9]*) ;;
              *) echo "::error::Publication requires a v* tag, got '${RELEASE_REF}'."; exit 1 ;;
            esac
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Release gate
        run: |
          case "$RELEASE_REF" in
            refs/tags/*|v[0-9]*) vlr check --release --tag "${RELEASE_REF#refs/tags/}" ;;
            *) vlr check ;;
          esac
          vlr version check

      - name: Prepare release documents (work tree only)
        run: vlr prepare --record release/meta/prepare.json

      - name: Release state
        id: state
        run: vlr status --github-output

      # dpkg-buildpackage from the prepared tree (debian/changelog carries this release); the
      # package bundles both skills and runs the meson tests. First among the artifact builds:
      # `vlr build-deb` empties release/ (all but meta/) before building.
      - name: Build the Debian package
        run: vlr build-deb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --unsafe-perm

      # The bundled payload-markdown skill must be the one of the payload-markdown this release
      # was built and tested against.
      - name: Check the vendored payload-markdown skill
        run: node scripts/sync-payload-markdown-skill.mjs --check

      # Runs `pnpm build` (pre_pack) and packs both npm tarballs every later step uses.
      - name: Build and pack npm packages
        run: NEXT_CPU_COUNT="$(nproc)" vlr build-npm

      - name: Run tests
        run: pnpm test:int

      - name: Lint
        run: pnpm lint

      # Both npm names from the built tarballs: same files, every export and its types, and
      # admin component paths under each installed name.
      - name: Verify both npm packages
        run: node scripts/verify-npm-packages.mjs --release release

      - name: Build and test the native CLI
        run: |
          meson setup build-native -Dinstall_skill_data=false
          meson compile -C build-native
          meson test -C build-native --print-errorlogs
          ./build-native/cli/pmdocs --version

      - name: Source archive and Homebrew formula
        run: |
          vlr source-archive
          vlr homebrew formula
          ruby -c release/homebrew/pmdocs.rb

      # Builds pmdocs from the source archive exactly like the formula does, in a directory with no
      # node_modules: both skills must come from the archive.
      - name: Homebrew source-build parity
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          work="$(mktemp -d)"
          tar -xzf "release/pmdocs-${VERSION}.tar.gz" -C "$work"
          src="$(find "$work" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          meson setup "$work/build" "$src" --prefix=/usr/local -Dinstall_skill_data=true
          meson compile -C "$work/build"
          DESTDIR="$work/stage" meson install -C "$work/build"
          mkdir -p "$work/project"
          cd "$work/project"
          export PMDOCS_DATA_DIR="$work/stage/usr/local/share/pmdocs"
          "$work/stage/usr/local/bin/pmdocs" doctor
          plan="$("$work/stage/usr/local/bin/pmdocs" install skill --agent codex --dry-run)"
          grep -F 'payload-markdown-docs/SKILL.md' <<< "$plan"
          grep -F 'payload-markdown/SKILL.md' <<< "$plan"

      # A clean, digest-pinned stock Ubuntu image (not the CI image), as container root; apt runs
      # inside that throwaway container only.
      - name: Smoke install the Debian package
        shell: bash ./ci/run-ci --image docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55 --root bash -euo pipefail {0}
        run: |
          apt-get update
          apt-get install -y ca-certificates
          apt-get install -y ./release/pmdocs_*.deb
          pmdocs --version
          pmdocs doctor
          pmdocs validate dev/docs-fixtures/basic --source payload-markdown-docs
          mkdir -p /tmp/project && cd /tmp/project
          pmdocs install skill --agent claude
          pmdocs skill check

      - name: Validate docs and rehearse the docs sync
        run: |
          ./build-native/cli/pmdocs validate ./docs --source "$PMDOCS_SOURCE"
          ./build-native/cli/pmdocs push ./docs --endpoint "$DOCS_SYNC_ENDPOINT" --source "$PMDOCS_SOURCE" --github-oidc --dry-run

      - name: Checksums and package contracts
        run: |
          vlr checksums
          vlr validate-artifacts
          vlr artifacts

      # Read-only, for both npm names: fails now if this version is already published with
      # different bytes.
      - name: Plan npm publication
        run: vlr publish-npm --mode enabled --dry-run

      - name: Preview the GitHub release
        run: |
          vlr release-title
          vlr release-body

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pmdocs-release-${{ steps.state.outputs.version }}
          path: release
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload the workflow-built pmdocs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pmdocs-linux-amd64-${{ steps.state.outputs.version }}
          path: build-native/cli/pmdocs
          if-no-files-found: error

  publish-debian:
    name: Publish the Debian package
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: build
    if: needs.build.outputs.publish == 'true'
    environment: Production
    concurrency:
      group: valkyrianlabs-apt-publish
      cancel-in-progress: false
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pmdocs-release-${{ needs.build.outputs.version }}
          path: release

      - name: Prepare and verify artifacts
        run: |
          vlr prepare
          vlr checksums --verify
          vlr validate-artifacts

      # Idempotent and sha256-verified: identical bytes already live are skipped, different bytes
      # are refused.
      - name: Publish to the APT repository
        env:
          RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE || 'disabled' }}
          NEXUS_APT_REPO: ${{ vars.NEXUS_APT_REPO || vars.NEXUS_REPO_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PASS }}
        run: vlr publish-deb --require-enabled

      # Installs the just-published package from the APT repository into a clean, digest-pinned
      # stock Ubuntu container (as container root), never onto the host.
      - name: Smoke install the published APT package
        shell: bash ./ci/run-ci --image docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55 --root bash -euo pipefail {0}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.valkyrianlabs.com/pubkey.gpg -o /etc/apt/keyrings/valkyrianlabs.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/valkyrianlabs.gpg] https://apt.valkyrianlabs.com stable main" \
            > /etc/apt/sources.list.d/valkyrianlabs.list
          apt-get update
          apt-get install -y pmdocs
          pmdocs --version | grep -F "pmdocs ${VERSION}"
          pmdocs doctor

  # npm trusted publishing (OIDC) works only on GitHub-hosted runners, so this job stays there.
  # After the APT package, so an APT failure never leaves npm as the only published surface.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build, publish-debian]
    if: needs.build.outputs.publish == 'true'
    environment:
      name: Production
      url: https://www.npmjs.com/package/payload-markdown-docs
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    env:
      RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE || 'enabled' }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Install vl-release
        run: bash .github/scripts/install-valkyrianlabs-tools.sh vl-release

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pmdocs-release-${{ needs.build.outputs.version }}
          path: release

      # Publishes both validated tarballs, payload-markdown-docs first (or skips one npm already
      # has with identical bytes), then waits until npm lists each by integrity under `latest`.
      - name: Publish to npm
        run: |
          set -euo pipefail
          vlr prepare
          vlr publish-npm --require-enabled

  github-release:
    name: GitHub release
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: [build, publish-debian, publish-npm]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pmdocs-release-${{ needs.build.outputs.version }}
          path: release

      - name: Create or update the release (notes from RELEASE_NOTES.md; assets immutable)
        run: |
          vlr prepare
          vlr checksums --verify
          vlr github-release

  # The formula's url is the source archive attached to the GitHub release; `vlr homebrew publish`
  # downloads it to verify the sha256 before touching the tap.
  publish-homebrew:
    name: Publish the Homebrew formula
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: [build, github-release]
    environment: Production
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Checkout the tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: valkyrianlabs/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pmdocs-release-${{ needs.build.outputs.version }}
          path: release

      - name: Publish the formula
        run: |
          vlr prepare
          vlr homebrew publish --tap-dir homebrew-tap

  publish-docs:
    name: Publish docs
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: [build, publish-npm]
    permissions:
      contents: read
      id-token: write # pmdocs push --github-oidc
    environment:
      name: Production
      url: ${{ env.DOCS_SYNC_ENDPOINT }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download the workflow-built pmdocs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pmdocs-linux-amd64-${{ needs.build.outputs.version }}
          path: .tools

      # Dogfoods the pmdocs this release built rather than a published one.
      - name: Validate and push docs
        run: |
          chmod +x .tools/pmdocs
          .tools/pmdocs --version
          .tools/pmdocs validate ./docs --source "$PMDOCS_SOURCE"
          .tools/pmdocs push ./docs --endpoint "$DOCS_SYNC_ENDPOINT" --source "$PMDOCS_SOURCE" --github-oidc --publish

  finalize:
    name: Record the release on main
    runs-on: [self-hosted, Linux, X64, ubuntu-latest-lts]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: [build, publish-debian, publish-npm, github-release, publish-homebrew, publish-docs]
    permissions:
      contents: write
    steps:
      # vlr finalize pushes to main; with a protected main it needs GitHub Actions as a bypass
      # actor or RELEASE_FINALIZE_TOKEN. Publication is already complete when this runs; re-run
      # only this job after fixing permissions.
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_FINALIZE_TOKEN || github.token }}

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pmdocs-release-${{ needs.build.outputs.version }}
          path: release

      # Re-prepare (deterministic), prove it matches what was built and published, then commit
      # RELEASE_NOTES.md, debian/changelog and the cleared staging files onto main.
      - name: Finalize
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          vlr prepare
          vlr finalize --record release/meta/prepare.json
