# vl-release repository contract: https://github.com/valkyrianlabs/vl-release
# Release with `vlr cut patch|minor|major --push`; .github/workflows/release.yml does the rest.
# `vlr help config` documents every key.
schema_version = 1

[tool]
requires = ">=0.4,<1"

[project]
name = "Payload Markdown Docs"
# Source archive prefix (pmdocs-X.Y.Z.tar.gz, the Homebrew formula's source).
package = "pmdocs"
repository = "valkyrianlabs/payload-markdown-docs"

[version]
canonical = "VERSION"
targets = [
  { kind = "meson", path = "meson.build" },
  { kind = "package_json", path = "package.json" },
  { kind = "homebrew", path = "homebrew/Formula/pmdocs.rb" },
]

[release]
branch = "main"
title = "v{version} - {title}"
test_command = ["pnpm", "test:int"]

# The native pmdocs CLI with both bundled agent skills: payload-markdown-docs and the
# payload-markdown skill vendored in skills/payload-markdown.
[debian]
distribution = "unstable"
urgency = "medium"
maintainer = "Valkyrian Labs <maintainers@valkyrianlabs.com>"
# Only cli/, meson, skills/, contracts/ and dev/docs-fixtures/ matter to the package build
# (and its meson tests); never copy dependencies, build output or local state.
build_excludes = [
  ".bashrc",
  ".claude",
  ".idea",
  ".vscode",
  "build-homebrew",
  "build-install",
  "build-native",
  "dist",
  "node_modules",
  "stage-homebrew",
  "stage-native",
  "test-results",
]

[[debian.packages]]
name = "pmdocs"
architecture = "amd64"
required_paths = [
  "usr/bin/pmdocs",
  "usr/share/doc/pmdocs/copyright",
  "usr/share/pmdocs/skills/payload-markdown-docs/codex/SKILL.md",
  "usr/share/pmdocs/skills/payload-markdown-docs/claude/SKILL.md",
  "usr/share/pmdocs/skills/payload-markdown/codex/SKILL.md",
  "usr/share/pmdocs/skills/payload-markdown/claude/SKILL.md",
  "usr/share/pmdocs/skills/payload-markdown/codex/skill.json",
  "usr/share/pmdocs/skills/payload-markdown/claude/skill.json",
]
forbidden_paths = [
  "usr/share/pmdocs/skills/*/node_modules/*",
  "usr/share/pmdocs/skills/*/__pycache__/*",
]
identical_files = [
  { member = "usr/share/pmdocs/skills/payload-markdown-docs/codex/SKILL.md", source = "skills/payload-markdown-docs/codex/SKILL.md" },
  { member = "usr/share/pmdocs/skills/payload-markdown-docs/claude/SKILL.md", source = "skills/payload-markdown-docs/claude/SKILL.md" },
  { member = "usr/share/pmdocs/skills/payload-markdown/codex/SKILL.md", source = "skills/payload-markdown/codex/SKILL.md" },
  { member = "usr/share/pmdocs/skills/payload-markdown/claude/SKILL.md", source = "skills/payload-markdown/claude/SKILL.md" },
  { member = "usr/share/pmdocs/skills/payload-markdown/codex/skill.json", source = "skills/payload-markdown/codex/skill.json" },
  { member = "usr/share/pmdocs/skills/payload-markdown/claude/skill.json", source = "skills/payload-markdown/claude/skill.json" },
]

[publish.apt]
repository_url = "https://apt.valkyrianlabs.com"
suite = "stable"
components = ["main"]
architectures = ["amd64"]
# Nexus can take a while to reindex after an upload.
verify_timeout = 1800
verify_interval = 30

# The Homebrew formula builds from this archive (tracked files of the prepared tree), which
# carries both skills, so the formula needs no npm resource.
[source_archive]
name = "{package}-{version}.tar.gz"

[homebrew]
formula = "homebrew/Formula/pmdocs.rb"
tap = "valkyrianlabs/homebrew-tap"
source = "release-asset"

# The Payload plugin: dist/ plus README, LICENSE and package.json. Published as
# @valkyrianlabs/payload-markdown-docs and, from the same tarball, as payload-markdown-docs.
[npm]
pre_pack = [["pnpm", "build"]]
required_paths = [
  "package/package.json",
  "package/README.md",
  "package/LICENSE",
  "package/dist/index.js",
  "package/dist/index.d.ts",
  "package/dist/package.js",
  "package/dist/admin/index.js",
  "package/dist/blocks/index.js",
  "package/dist/fields/index.js",
  "package/dist/mcp/index.js",
  "package/dist/migrations/index.js",
  "package/dist/next/index.js",
  "package/dist/skills/payload-markdown-docs/claude/SKILL.md",
  "package/dist/skills/payload-markdown-docs/codex/SKILL.md",
]
forbidden_paths = [
  "package/src/*",
  "package/dev/*",
  "package/docs/*",
  "package/cli/*",
  "package/skills/*",
  "package/dist/skills/payload-markdown/*",
  "package/node_modules/*",
  "package/.env*",
  "package/*.tsbuildinfo",
  "package/dist/**/*.spec.*",
]
identical_files = [
  { member = "package/README.md", source = "README.md" },
  { member = "package/LICENSE", source = "LICENSE" },
  { member = "package/dist/skills/payload-markdown-docs/claude/SKILL.md", source = "skills/payload-markdown-docs/claude/SKILL.md" },
  { member = "package/dist/skills/payload-markdown-docs/codex/SKILL.md", source = "skills/payload-markdown-docs/codex/SKILL.md" },
]

# The unscoped name: vlr derives payload-markdown-docs-X.Y.Z.tgz from the canonical tarball.
# Only package.json "name" and dist/package.js (PAYLOAD_MARKDOWN_DOCS_PACKAGE, which Payload
# admin component paths use) differ; validate-artifacts fails on any other difference.
[[npm.aliases]]
name = "payload-markdown-docs"
rewrite = ["package/dist/package.js"]

# npmjs.com through npm trusted publishing: both packages trust this repository's
# .github/workflows/release.yml (environment Production); no token secret.
[[publish.npm]]
name = "npmjs"
registry = "https://registry.npmjs.org/"
auth = "oidc"
