name: Publish docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'skills/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'skills/**'

permissions:
  id-token: write
  contents: read

env:
  # Replace with the Payload docs set slug. Do not rely on repository-name
  # inference in copied workflows.
  PMDOCS_SOURCE: "<users-upstream-docs-id>"

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pmdocs
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL https://apt.valkyrianlabs.com/pubkey.gpg \
            -o /etc/apt/keyrings/valkyrianlabs.gpg
          sudo chmod 0644 /etc/apt/keyrings/valkyrianlabs.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/valkyrianlabs.gpg] https://apt.valkyrianlabs.com stable main" \
            | sudo tee /etc/apt/sources.list.d/valkyrianlabs.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y pmdocs

      - name: Check pmdocs
        run: |
          pmdocs --version
          pmdocs --help

      - name: Validate docs
        run: pmdocs validate --source "$PMDOCS_SOURCE"

      - name: Plan docs sync locally
        if: github.event_name == 'pull_request'
        run: pmdocs plan --source "$PMDOCS_SOURCE"

      - name: Dry-run docs sync
        # Optional server-side dry run for pull requests. Pull request OIDC
        # tokens carry `ref: refs/pull/<n>/merge`, so the Payload docs set must
        # allow pull requests and the server must accept PR tokens for the
        # docs set branch. Fork pull requests never receive an OIDC token.
        # Opt in with the repository variable DOCS_SYNC_PR_DRY_RUN=true.
        if: >-
          github.event_name == 'pull_request' &&
          vars.DOCS_SYNC_PR_DRY_RUN == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          pmdocs push \
            --endpoint "$DOCS_SYNC_ENDPOINT" \
            --source "$PMDOCS_SOURCE" \
            --github-oidc \
            --dry-run
        env:
          DOCS_SYNC_ENDPOINT: ${{ secrets.DOCS_SYNC_ENDPOINT }}

      - name: Publish docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Requires sync.allowWrites: true, sync.allowPublish: true,
        # and target.enableDrafts: true on the Payload server.
        run: |
          pmdocs push \
            --endpoint "$DOCS_SYNC_ENDPOINT" \
            --source "$PMDOCS_SOURCE" \
            --github-oidc \
            --publish
        env:
          DOCS_SYNC_ENDPOINT: ${{ secrets.DOCS_SYNC_ENDPOINT }}
