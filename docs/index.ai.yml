version: 1

title: Payload Markdown Docs Documentation
canonical: /plugins/payload-markdown-docs
output: /plugins/payload-markdown-docs.md

description: >
  Consolidated AI-facing documentation export for Payload Markdown Docs.

preamble: |
  This file is intended for AI agents, editor tooling, Codex, ChatGPT,
  and offline reference.

  Read the documents in the listed order. Installation and quick start
  should be treated as prerequisite context before architecture, configuration,
  workflow, frontend integration, admin, or reference material.

order:
  - ./index.md
  - ./getting-started/installation.md
  - ./getting-started/quick-start.md
  - ./getting-started/keygen.md
  - ./dedicated-docs-workflow.md
  - ./concepts/architecture.md
  - ./concepts/docs-groups.md
  - ./concepts/docs-sets.md
  - ./concepts/route-reservations.md
  - ./concepts/security-model.md
  - ./configuration/plugin-config.md
  - ./configuration/docs-sets.md
  - ./configuration/sync-config.md
  - ./configuration/routing-config.md
  - ./configuration/github-oidc.md
  - ./workflow/local-validation.md
  - ./workflow/ci-github-actions.md
  - ./workflow/signed-push.md
  - ./workflow/publishing.md
  - ./workflow/agent-skill-installer.md
  - ./frontend/route-adapter.md
  - ./frontend/metadata.md
  - ./frontend/sidebar.md
  - ./admin/docs-set-manager.md
  - ./admin/overrides.md
  - ./reference/cli.md
  - ./reference/manifest.md
  - ./reference/frontmatter.md
  - ./reference/troubleshooting.md
  - ./reference/migration.md

exclude:
  - ./drafts/**
  - ./internal.md

orphans: append
headingMode: normalize
