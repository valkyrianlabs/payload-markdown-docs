profiles:
  openai-premium-deep-triage:
    provider: openai

    default_max_output_tokens:
      emergency_triage: 15000
      triage: 12000
      draft: 13500
      polish: 15000
      release_notes: 15000

    stages:
      emergency_triage:
        model: gpt-5-nano
        reasoning_effort: low
      triage:
        model: gpt-5.4-nano
        reasoning_effort: medium
      draft:
        model: gpt-5.4-mini
        reasoning_effort: medium
        structured_mode: strict_json_schema
      polish:
        model: gpt-5.4
        reasoning_effort: xhigh
      release_notes:
        model: gpt-5.5
        reasoning_effort: xhigh
